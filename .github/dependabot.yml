# Grouped, weekly updates (QOHA-3756). Majors of packages that only work together arrive
# as one PR per family; every minor and patch update of a directory arrives as one PR.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      django:
        patterns:
          - "django"
          - "djangorestframework"
          - "django-*"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
